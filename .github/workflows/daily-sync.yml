name: Daily Portfolio Sync

on:
  schedule:
    # 8:30 PM UTC = 4:30 PM ET (30 min after market close), during EDT.
    # Note: this doesn't auto-adjust for daylight saving — a real production
    # version would handle DST properly. Good enough for a personal project.
    - cron: "30 20 * * 1-5"  # weekdays only (Mon-Fri)
  workflow_dispatch: {}  # allows manually triggering a run from the Actions tab, for testing

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Schwab tokens
        run: echo '${{ secrets.SCHWAB_TOKENS_JSON }}' > tokens.json

      - name: Sync Schwab holdings to Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          SCHWAB_CLIENT_ID: ${{ secrets.SCHWAB_CLIENT_ID }}
          SCHWAB_CLIENT_SECRET: ${{ secrets.SCHWAB_CLIENT_SECRET }}
          SCHWAB_REDIRECT_URI: ${{ secrets.SCHWAB_REDIRECT_URI }}
        run: python scripts/sync_schwab_to_notion.py

      - name: Generate AI summary
        env:
          PYTHONUNBUFFERED: "1"
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_LOG_DATABASE_ID: ${{ secrets.NOTION_LOG_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_ai_summary.py
